#Port
server.port=9090
#API per il service
server.servlet.context-path=/serviceSpringBoot

#connessione al database
spring.datasource.url=jdbc:mysql://localhost:3306/db_wsda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=myDB13579
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.show-sql=true
# Formatta l'output SQL in console per renderlo leggibile
spring.jpa.properties.hibernate.format_sql=true
# 'validate' assicura che il DB corrisponda alle Entity senza modificarlo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#log spring security
logging.level.org.springframework.security=DEBUG

