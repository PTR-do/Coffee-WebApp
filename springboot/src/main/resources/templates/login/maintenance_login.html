<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espresso - Maintenance Login</title>
    <link rel="stylesheet" th:href="@{/css/1_login.css}" />
</head>

<body>
<div class="container">
    <h1 class="title">ESPRESSO</h1>
    <p>Gestione Manutenzione<p>

    <form action="/serviceSpringBoot/login/maintenance" method="post" class="login-form">
    <input type="hidden" name="role" value="maintenance">
        <div class="input-group">
            <label for="id">ID di accesso</label>
            <input type="text" id="id" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
</div>
</body>

</html>
