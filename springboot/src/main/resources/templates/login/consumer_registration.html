<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espresso - Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/1_login.css}" />
</head>

<body>
<div class="container">
    <h1 class="title">ESPRESSO</h1>
    <p>Crea un nuovo account</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Questo testo verrà sostituito dal contenuto di "error"
    </div>

    <form action="/serviceSpringBoot/registration" method="POST" class="register-form">
        <div class="input-group">
            <label for="username">Nome utente</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="input-group">
            <label for="confirm-password">Conferma password</label>
            <input type="password" id="confirm-password" name="confirmPassword" required>
        </div>
        <button type="submit" class="btn">Registrati</button>
    </form>

    <p class="login-text">
        Hai già un account?
        <a th:href="@{/login/consumer}" class="login-link">Accedi</a>
    </p>
</div>
</body>

</html>
